<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfying Levels</title>
    <link id="theme-stylesheet" rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Satisfying Levels</h1>
        <div id="theme-switcher">
            <label for="theme-select">Style d'UI :</label>
            <select id="theme-select">
                <option value="style.css" data-theme="modern">Moderne</option>
                <option value="style-retro.css" data-theme="retro">Retro Pokémon</option>
            </select>
        </div>
    </header>
    <main id="game-container">
        <div id="level-selection">
            <h2>Choose a Level</h2>
            <div id="levels"></div>
        </div>
        <div id="game-area" class="hidden"></div>
    </main>
    <script src="main.js"></script>
    <script src="theme.js"></script>
</body>
</html>

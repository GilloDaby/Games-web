<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 2D - Pixi.js</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #0f111a;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    #game-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <script defer src="biomes.js"></script>
  <script defer src="inventory.js"></script>
  <script defer src="crafting.js"></script>
  <script defer src="save.js"></script>
  <script defer src="ai.js"></script>
  <script defer src="mob.js"></script>
  <script defer src="player.js"></script>
  <script defer src="ui.js"></script>
  <script defer src="game.js"></script>
</body>
</html>
